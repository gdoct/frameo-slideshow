server {
    listen 80;
    root /usr/share/nginx/html;

    # Photo folder (PHOTOS_DIR, mounted read-only); JSON listing used by the "nas" slideshow.
    location /photos/ {
        alias /photos/;
        autoindex on;
        autoindex_format json;
        expires 1h;
    }

    # /picsum, /nas, /clock ... all load the same app; it reads the path.
    location / {
        add_header Cache-Control no-cache;   # revalidate, so screens pick up new deploys
        try_files $uri /index.html;
    }
}
